<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Metadati principali e titolo mostrato nella scheda del browser. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Progetto - Salvatore Ciaramidaro</title>

    <!-- Carica Tailwind CSS e abilita il tema scuro tramite la classe html. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configurazione personalizzata di Tailwind usata dall'interfaccia Vue.
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    boxShadow: {
                        soft: '0 18px 40px -20px rgba(20, 33, 61, 0.35)'
                    }
                }
            }
        };
    </script>

    <!-- Fogli di stile esterni e stili personalizzati del progetto. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
   
    <!-- Vue gestisce i componenti dell'applicazione e Vue Router la navigazione. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
</head>
<body>
    <!-- Punto di montaggio in cui Vue inserisce l'intera applicazione. -->
    <div id="app"></div>

    <!-- Librerie JavaScript necessarie ai componenti interattivi di Bootstrap. -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Codice principale: viste, router, gestione dati e accessibilita. -->
    <script src="app.js"></script>
</body>
</html>
